services:
  baileys_interactive:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "22"
    container_name: baileys_interactive
    restart: unless-stopped
    init: true

    ports:
      - "8787:8787"

    env_file:
      - .env

    volumes:
      - baileys_auth:/app/auth
      - baileys_data:/app/data

    deploy:
      resources:
        limits:
          # Ajuste conforme o hardware disponível.
          # 2 CPUs e 2 GB RAM cobrem syncs iniciais grandes (milhares de
          # mensagens) sem OOM. SQLite + WAL + ingest chunked aproveitam o
          # segundo core para I/O em background enquanto o event loop
          # principal continua livre para o WebSocket do Baileys.
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "1"

    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  baileys_auth:
  baileys_data:
