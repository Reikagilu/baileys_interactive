services:
  baileys_interactive:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "22"
        REPO_URL: "https://github.com/reikagilu/baileys_interactive.git"
        REPO_REF: "main"
    container_name: baileys_interactive
    restart: unless-stopped
    init: true

    ports:
      - "8787:8787"

    environment:
      NODE_ENV: "production"
      PORT: "8787"
      AUTH_FOLDER: "auth"
      WEBHOOK_DB_PATH: "/app/data/webhooks.sqlite"
      INTEGRATIONS_DB_PATH: "/app/data/integrations.sqlite"
      PAIRING_CODE_ENABLED: "true"
      API_KEY: "REDACTED-ROTATED-API-KEY"
      ALLOW_PRIVATE_NETWORK_WEBHOOKS: "true"
      ALLOW_PRIVATE_NETWORK_INTEGRATIONS: "true"
      WEBHOOK_EMBEDDED_WORKER_ENABLED: "true"
      SERVER_URL: "http://192.168.4.26:8787"
      BAILEYS_LOG: "false"

    volumes:
      - baileys_auth:/app/auth
      - baileys_data:/app/data

    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  baileys_auth:
  baileys_data:
