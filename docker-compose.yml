services:
  baileys_interactive:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "22"
    container_name: baileys_interactive
    restart: unless-stopped
    init: true

    ports:
      - "8787:8787"

    env_file:
      - .env

    volumes:
      - baileys_auth:/app/auth
      - baileys_data:/app/data

    deploy:
      resources:
        limits:
          # Ajuste conforme o hardware disponível.
          # 1 CPU e 1 GB RAM são valores conservadores para instâncias médias.
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  baileys_auth:
  baileys_data:
